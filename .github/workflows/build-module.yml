name: Build Magisk & KernelSU Module

on:
  push:
    branches: [ develop, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Go tests
        run: go test -v ./...

  build-module:
    name: Build Module Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Magisk / KernelSU Module
        run: |
          chmod +x scripts/build_module.sh
          ./scripts/build_module.sh

      - name: Upload Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netclient-magisk
          path: |
            dist/netclient-magisk.zip
            dist/netclient-magisk.zip.sha256

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/netclient-magisk.zip
            dist/netclient-magisk.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
