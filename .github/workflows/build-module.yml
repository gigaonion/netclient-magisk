name: Build Magisk & KernelSU Module

on:
  push:
    branches: [ develop, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Go tests
        run: go test -v ./...

  build-module:
    name: Build Module Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Magisk / KernelSU Module
        run: |
          chmod +x scripts/build_module.sh
          ./scripts/build_module.sh

      - name: Generate Changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ github.ref_name }}^ 2>/dev/null || true)
          echo "## 変更履歴 (Changelog)" > release_notes.md
          echo "" >> release_notes.md
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..${{ github.ref_name }} --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" >> release_notes.md
          else
            git log -n 50 --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "### チェックサム (SHA-256 Checksums)" >> release_notes.md
          echo '```' >> release_notes.md
          cat dist/netclient-magisk.zip.sha256 >> release_notes.md
          echo '```' >> release_notes.md

      - name: Upload Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netclient-magisk
          path: |
            dist/netclient-magisk.zip
            dist/netclient-magisk.zip.sha256

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: false
          files: |
            dist/netclient-magisk.zip
            dist/netclient-magisk.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
